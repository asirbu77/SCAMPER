# Mouse Reach Task Transfer Training Config
#
# Two training modes:
#   decoder_only: Freeze decoder, train new encoder
#   prior_decoder: Freeze prior + decoder, train residual encoder
#
# Usage:
#   python -m scamper.agent.task_transfer.mouse_reach.train mode=decoder_only
#   python -m scamper.agent.task_transfer.mouse_reach.train mode=prior_decoder

defaults:
  - _self_

# Training mode: "decoder_only" or "prior_decoder"
mode: "decoder_only"

# Checkpoint to load (mlp_prior checkpoint)
checkpoint:
  path: "/root/vast/eric/SCAMPER/model_checkpoints/260319_053201_537706"
  step: 3  # null = latest

# Mode-specific settings
decoder_only:
  _placeholder: true

prior_decoder:
  deterministic_prior: true
  noise_logvar: -2.0

# Network architecture
network:
  policy_layers: [512, 512, 512]
  value_layers: [512, 512, 512]

# Training parameters
train:
  num_timesteps: 10_000_000_000
  episode_length: 100
  num_envs: 4096
  batch_size: 1024
  num_minibatches: 16
  num_updates_per_batch: 4
  learning_rate: 1e-4
  entropy_cost: 1e-4
  discounting: 0.99
  clipping_epsilon: 0.2
  gae_lambda: 0.95
  max_grad_norm: 50.0
  vf_loss_coefficient: 5.0
  reward_scaling: 1.0
  normalize_observations: true
  unroll_length: 20
  action_repeat: 1
  seed: 0
  eval_every: 100_000_000

# Environment settings
env:
  mujoco_impl: "jax"
  target_mode: "random_volume"
  target_size: 0.001
  target_margin: 0.003
  ctrl_cost_weight: 0.01

# Checkpointing settings
checkpointing:
  enabled: true
  model_path: "./model_checkpoints"
  max_to_keep: null

# Logging settings
logging:
  project: "SCAMPER"
  group_name: "mouse_reach_transfer"
  exp_name: "mouse_reach_transfer"
  render_camera: "my_camera"
  render_fps: 100
  render_height: 480
  render_width: 640
  render_every: 1
