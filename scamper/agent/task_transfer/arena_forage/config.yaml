# Arena Forage Task Transfer Training Config
#
# Seven training modes:
#   mimic_mjx: Freeze decoder, train new encoder
#   res_control: Freeze motion prior + decoder, train residual encoder (from distill_expert checkpoint)
#   bp_res_control: Freeze behavior prior (rgm) + decoder, train residual encoder (from behavior_prior checkpoint)
#   prior_gating: Freeze motion prior + behavior prior + decoder, train residual + gate (from behavior_prior checkpoint)
#   prior_interp: Freeze motion prior + behavior prior + decoder, train residual with a fixed linear blend of both priors (from behavior_prior checkpoint)
#   prior_schedule: Like prior_gating, but the gate follows a fixed exploration schedule instead of being a policy output (from behavior_prior checkpoint)
#   scratch: Train both policy and decoder from random initialization
#
# Usage:
#   python -m scamper.agent.task_transfer.arena_forage.train mode=mimic_mjx
#   python -m scamper.agent.task_transfer.arena_forage.train mode=res_control
#   python -m scamper.agent.task_transfer.arena_forage.train mode=bp_res_control
#   python -m scamper.agent.task_transfer.arena_forage.train mode=prior_gating
#   python -m scamper.agent.task_transfer.arena_forage.train mode=prior_interp
#   python -m scamper.agent.task_transfer.arena_forage.train mode=prior_schedule
#   python -m scamper.agent.task_transfer.arena_forage.train mode=scratch

defaults:
  - _self_

# Training mode: "mimic_mjx", "res_control", "bp_res_control", "prior_gating",
# "prior_interp", "prior_schedule", or "scratch"
mode: "mimic_mjx"

# Checkpoint to load
checkpoint:
  path: "./model_checkpoints/YYMMDD_HHMMSS"  # Replace with your checkpoint
  step: null  # null = latest

# Mode-specific settings
mimic_mjx:
  # No extra config needed for mimic_mjx mode
  _placeholder: true

res_control:
  deterministic_prior: true
  noise_logvar: -2.0

bp_res_control:
  # Residual control of the behavior prior (rgm): latent = residual + rgm_mean.
  rgm_noise: false  # false = deterministic (latent = residual + rgm_mean), true = sample with noise
  rgm_logvar: -2.0  # null = use rgm's predicted logvar, float = fixed logvar (only when rgm_noise=true)

prior_gating:
  gate_bias: 0.5    # Threshold for binary gate: gate = 1 if gate_logit > gate_bias
  gate_margin: 0.2  # Hysteresis margin for bistable switching (0.0 = no hysteresis)
  rgm_noise: true   # false = use rgm_mean only, true = sample with noise
  rgm_logvar: -2.25 # null = use predicted logvar, float = fixed logvar (only when rgm_noise=true)

prior_interp:
  # Fixed linear blend of both priors, with the residual added on top:
  #   latent = alpha * prior_mean + (1 - alpha) * rgm_z + residual
  # alpha weights the priors only; the residual keeps full authority at every
  # alpha. The policy outputs only the residual (action size = latent_size).
  alpha: 0.5        # Blend weight in [0, 1]. Both endpoints reproduce an
                    # existing mode exactly: 1.0 == res_control (prior_mean +
                    # residual), 0.0 == bp_res_control (rgm_z + residual).
  rgm_noise: false  # false = deterministic (rgm_z = rgm_mean), true = sample with noise
  rgm_logvar: -2.0  # null = use predicted logvar, float = fixed logvar (only when rgm_noise=true)

prior_schedule:
  # Same latent construction as prior_gating (binary, never a blend):
  #   latent = gate * (prior_mean + residual) + (1 - gate) * rgm_z
  # but the gate is drawn from a fixed schedule rather than emitted by the
  # policy, so the action size is latent_size (no gate head). Checkpoints are
  # NOT interchangeable with prior_gating.
  #
  # The gate is a two-state Markov chain with stationary P(gate=1) = p(t) and
  # switching timescale bout_tau, so the agent runs in bouts rather than
  # chattering at control rate.
  p_start: 0.0      # Gate probability at the start of the ramp. 0.0 = pure
                    # behavior prior sampling. Consider a small floor (~0.05)
                    # to keep the residual head receiving real gradient during
                    # a long warmup -- with no signal the entropy bonus
                    # inflates its scale unopposed, making the handoff abrupt.
  p_end: 1.0        # Gate probability at the end of the ramp. 1.0 = fully
                    # residual control of the motion prior (== res_control).
  warmup_frac: 0.1  # Fraction of num_timesteps held at p_start before ramping
  ramp_frac: 0.6    # Fraction of num_timesteps spent ramping p_start -> p_end;
                    # progress past warmup_frac + ramp_frac holds at p_end
  ramp_shape: "cosine"  # 'linear' or 'cosine' interpolation across the ramp
  bout_tau: 25.0    # Switching timescale in env steps (larger = longer bouts)
  rgm_noise: true   # false = use rgm_mean only, true = sample with noise
  rgm_logvar: -2.25 # null = use predicted logvar, float = fixed logvar (only when rgm_noise=true)
  eval_progress: 1.0  # Schedule progress used by Brax's internal evaluator. It
                      # resets eval_env itself, so it cannot follow the
                      # schedule; pinning at 1.0 makes eval/episode_reward a
                      # clean learning curve for the deployment regime. The
                      # rollout videos/gate curves mirror the real schedule.

scratch:
  # Actuator type: true = torque (matches imitation training), false = PD actuators
  # Only applies in scratch mode. mimic_mjx always uses torque.
  torque_actuators: true

# Network architecture
network:
  policy_layers: [2048, 1024, 512]
  value_layers: [2048, 1024, 1024, 512]

# Training parameters
train:
  num_timesteps: 2_000_000_000
  episode_length: 2000
  num_envs: 1024
  batch_size: 1024
  num_minibatches: 16
  num_updates_per_batch: 4
  learning_rate: 1e-4
  entropy_cost: 1e-2
  discounting: 0.99
  clipping_epsilon: 0.3
  gae_lambda: 0.95
  max_grad_norm: 50.0
  vf_loss_coefficient: 0.5
  reward_scaling: 1.0
  normalize_observations: true
  unroll_length: 20
  action_repeat: 1
  seed: 0
  eval_every: 15_000_000

# Environment settings
env:
  xml_variant: "no-tail-collisions"  # 'full-collisions', 'limited-collisions', or 'no-tail-collisions'
  mujoco_impl: "warp"  # 'jax' or 'warp'
  # Arena forage task parameters
  num_treats: 10
  treat_sphere_radius: 0.06
  treat_height: 0.03
  min_spawn_radius: 0.75
  spawn_radius: 2.0
  scent_sigma: 0.2
  # Reward term weights
  reward_weights:
    treat_collection: 500.0
    scent_proximity: 0.0

# Checkpointing settings
checkpointing:
  enabled: true
  model_path: "./scratch/arena_forage_checkpoints"  # Base directory (run_id subdir created under this)
  max_to_keep: null

# Logging settings
logging:
  project: "SCAMPER"
  group_name: "arena_forage_transfer"
  exp_name: "arena_forage_transfer"
  render_camera: "close_profile-rodent"
  render_fps: 50
  render_height: 720
  render_width: 1280
  render_every: 1  # Render video every N evaluation steps (always renders first eval)
  scent_grid_resolution: 100  # Number of grid cells per axis for scent heatmap video
