# Follow-Target Task Transfer Training Config
#
# Three training modes:
#   decoder_only: Freeze decoder, train new encoder
#   prior_decoder: Freeze prior + decoder, train residual encoder
#   scratch: Train both policy and decoder from random initialization
#
# Usage:
#   python -m scamper.agent.task_transfer.follow_target.train mode=decoder_only
#   python -m scamper.agent.task_transfer.follow_target.train mode=prior_decoder
#   python -m scamper.agent.task_transfer.follow_target.train mode=scratch

defaults:
  - _self_

# Training mode: "decoder_only", "prior_decoder", or "scratch"
mode: "decoder_only"

# Checkpoint to load (mlp_prior checkpoint)
checkpoint:
  path: "./model_checkpoints/YYMMDD_HHMMSS"  # Replace with your checkpoint
  step: null  # null = latest

# Mode-specific settings
decoder_only:
  _placeholder: true

prior_decoder:
  deterministic_prior: true
  noise_logvar: -2.0

scratch:
  # No extra config needed for scratch mode - uses network settings below
  _placeholder: true

# Network architecture
network:
  policy_layers: [1024, 512, 256]
  value_layers: [1024, 512, 256]

# Training parameters
train:
  num_timesteps: 2_000_000_000
  episode_length: 500
  num_envs: 4096
  batch_size: 1024
  num_minibatches: 16
  num_updates_per_batch: 4
  learning_rate: 1e-4
  entropy_cost: 1e-4
  discounting: 0.99
  clipping_epsilon: 0.2
  gae_lambda: 0.95
  max_grad_norm: 50.0
  vf_loss_coefficient: 5.0
  reward_scaling: 1.0
  normalize_observations: true
  unroll_length: 20
  action_repeat: 1
  seed: 0
  eval_every: 15_000_000

# Environment settings
env:
  xml_variant: "limited-collisions"  # 'full-collisions', 'limited-collisions', or 'no-tail-collisions'
  mujoco_impl: "jax"  # 'jax' or 'warp'
  # Target trajectory mode: "generated" (random walk) or "dataset" (from rollout HDF5)
  target_mode: "generated"
  # Path to rollout dataset HDF5 from collect_rollout_dataset.py (required when target_mode=dataset)
  dataset_path: null
  # Which rollout type key from the HDF5 (reads "{key}_qpos" dataset)
  dataset_key: "encoder_decoder"
  # Render imitation ghost rodent in eval videos (only when target_mode=dataset)
  render_imitation: false
  # Train/test split ratio for dataset mode (fraction used for training).
  # Only applies when target_mode="dataset". Set to 1.0 to disable split.
  train_subset_ratio: 0.8
  amp_x: 0.1
  amp_y: 0.1
  amp_z: 0.2
  z_min_offset: 0.0
  sigma_smooth: 30.0
  distance_margin: 0.5
  # Reward term weights
  reward_weights:
    distance_to_target: 1.0

# Checkpointing settings
checkpointing:
  enabled: true
  model_path: "./scratch/follow_target_checkpoints"  # Base directory (run_id subdir created under this)
  max_to_keep: null

# Logging settings
logging:
  project: "vnl-playground"
  group_name: "follow_target_transfer"
  exp_name: "follow_target_transfer"
  render_camera: "close_profile-rodent"
  render_fps: 50
  render_height: 480
  render_width: 640
  render_every: 1  # Render video every N evaluation steps (always renders first eval)
