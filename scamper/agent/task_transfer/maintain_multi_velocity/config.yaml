# Maintain Multi-Velocity Task Transfer Training Config
#
# Trains a policy to maintain various target velocities.
# Each episode samples a random target from U(min_velocity, max_velocity).
# The target velocity is included in the task observation.
#
# Four training modes:
#   decoder_only: Freeze decoder, train new encoder
#   prior_decoder: Freeze prior + decoder, train residual encoder (from mlp_prior checkpoint)
#   distill: Freeze prior + decoder, train residual encoder (from distill checkpoint)
#   scratch: Train both policy and decoder from random initialization
#
# Usage:
#   python -m scamper.agent.task_transfer.maintain_multi_velocity.train mode=decoder_only
#   python -m scamper.agent.task_transfer.maintain_multi_velocity.train mode=prior_decoder
#   python -m scamper.agent.task_transfer.maintain_multi_velocity.train mode=distill
#   python -m scamper.agent.task_transfer.maintain_multi_velocity.train mode=scratch

defaults:
  - _self_

# Training mode: "decoder_only", "prior_decoder", "distill", or "scratch"
mode: "decoder_only"

# Checkpoint to load (mlp_prior checkpoint)
checkpoint:
  path: "./model_checkpoints/YYMMDD_HHMMSS"  # Replace with your checkpoint
  step: null  # null = latest

# Mode-specific settings
decoder_only:
  _placeholder: true

prior_decoder:
  deterministic_prior: true
  noise_logvar: -2.0

distill:
  deterministic_prior: true
  noise_logvar: -2.0

scratch:
  # Actuator type: true = torque (matches imitation training), false = PD actuators
  # Only applies in scratch mode. decoder_only and prior_decoder always use torque.
  torque_actuators: true

# Network architecture
network:
  policy_layers: [1024, 512, 256]
  value_layers: [1024, 512, 256]

# Training parameters
train:
  num_timesteps: 2_000_000_000
  episode_length: 2000
  num_envs: 4096
  batch_size: 1024
  num_minibatches: 16
  num_updates_per_batch: 4
  learning_rate: 1e-4
  entropy_cost: 1e-4
  discounting: 0.99
  clipping_epsilon: 0.2
  gae_lambda: 0.95
  max_grad_norm: 50.0
  vf_loss_coefficient: 5.0
  reward_scaling: 1.0
  normalize_observations: true
  unroll_length: 20
  action_repeat: 1
  seed: 0
  eval_every: 15_000_000

# Environment settings
env:
  xml_variant: "limited-collisions"  # 'full-collisions', 'limited-collisions', or 'no-tail-collisions'
  mujoco_impl: "jax"  # 'jax' or 'warp'
  init_z: 0.0
  min_velocity: 0.1
  max_velocity: 2.0
  # Reward term weights
  reward_weights:
    forward_velocity: 1.0
    lateral_velocity: 0.5
    angular_velocity_z: 0.1
    control_diff_cost: 0.0
    control_cost: 0.0
    energy_cost: 0.0
  energy_cost_max_value: 50.0
  max_y: 0.15  # Terminate episode if |y| exceeds this (meters)

# Evaluation settings
eval:
  speeds: [0.3, 0.5, 0.8, 1.0, 1.5]

# Checkpointing settings
checkpointing:
  enabled: true
  model_path: "./scratch/maintain_multi_velocity_checkpoints"  # Base directory (run_id subdir created under this)
  max_to_keep: null

# Logging settings
logging:
  project: "SCAMPER"
  group_name: "maintain_multi_velocity_transfer"
  exp_name: "maintain_multi_velocity_transfer"
  render_camera: "close_profile-rodent"
  render_fps: 50
  render_height: 480
  render_width: 640
  render_every: 1  # Render video every N evaluation steps (always renders first eval)
