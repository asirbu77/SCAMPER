# Maintain Velocity Task Transfer Training Config
#
# Three training modes:
#   mimic_mjx: Freeze decoder, train new encoder
#   res_control: Freeze motion prior + decoder, train residual encoder (from distill_expert checkpoint)
#   scratch: Train both policy and decoder from random initialization
#
# Usage:
#   python -m scamper.agent.task_transfer.maintain_velocity.train mode=mimic_mjx
#   python -m scamper.agent.task_transfer.maintain_velocity.train mode=res_control
#   python -m scamper.agent.task_transfer.maintain_velocity.train mode=scratch

defaults:
  - _self_

# Training mode: "mimic_mjx", "res_control", or "scratch"
mode: "mimic_mjx"

# Checkpoint to load
checkpoint:
  path: "./model_checkpoints/YYMMDD_HHMMSS"  # Replace with your checkpoint
  step: null  # null = latest

# Mode-specific settings
mimic_mjx:
  _placeholder: true

res_control:
  deterministic_prior: true
  noise_logvar: -2.0

scratch:
  # Actuator type: true = torque (matches imitation training), false = PD actuators
  # Only applies in scratch mode. mimic_mjx always uses torque.
  torque_actuators: true

# Network architecture
network:
  policy_layers: [2048, 1024, 512]
  value_layers: [2048, 1024, 1024, 512]

# Training parameters
train:
  num_timesteps: 400_000_000
  episode_length: 1000
  num_envs: 1024
  batch_size: 1024
  num_minibatches: 16
  num_updates_per_batch: 4
  learning_rate: 1e-4
  entropy_cost: 1e-2
  discounting: 0.99
  clipping_epsilon: 0.3
  gae_lambda: 0.95
  max_grad_norm: 50.0
  vf_loss_coefficient: 0.5
  reward_scaling: 1.0
  normalize_observations: true
  unroll_length: 20
  action_repeat: 1
  seed: 0
  eval_every: 15_000_000

# Environment settings
env:
  xml_variant: "no-tail-collisions"  # 'full-collisions', 'limited-collisions', or 'no-tail-collisions'
  mujoco_impl: "warp"  # 'jax' or 'warp'
  init_z: 0.0
  target_speed: 1.25
  # Reward term weights
  reward_weights:
    forward_velocity: 1.0
    lateral_velocity: 0.0
    angular_velocity_z: 0.0
    control_diff_cost: 0.0

# Checkpointing settings
checkpointing:
  enabled: true
  model_path: "./scratch/maintain_velocity_checkpoints"  # Base directory (run_id subdir created under this)
  max_to_keep: null

# Logging settings
logging:
  project: "SCAMPER"
  group_name: "maintain_velocity_transfer"
  exp_name: "maintain_velocity_transfer"
  render_camera: "close_profile-rodent"
  render_fps: 50
  render_height: 720
  render_width: 1280
  render_every: 1  # Render video every N evaluation steps (always renders first eval)
