# =============================================================================
# Rodent Behavior-Prior Training Configuration
# =============================================================================
# Configuration for training a behavior-prior network on top of a pretrained
# distill_expert checkpoint. The distill_expert encoder, decoder, and motion
# prior are frozen; only the behavior prior is trained, using KL divergence
# loss against the encoder's per-step latent distribution.
# =============================================================================

# =============================================================================
# Teacher Model Configuration (pretrained distill_expert)
# =============================================================================
# Path to the pretrained distill_expert checkpoint with encoder, decoder, and
# motion prior.
teacher_config:
  # Path to pretrained distill_expert checkpoint (REQUIRED)
  checkpoint_path: null
  checkpoint_step: null               # Specific step to load (null = latest)

# =============================================================================
# VNL Environment Configuration
# =============================================================================
env_config:
  env_name: "RodentImitation"
  mujoco_impl: "jax"

  # Physics Solver Settings
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  naconmax: 45000
  njmax: 1000
  noslip_iterations: 0

  # Timing Configuration
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  # Reference Clip Settings
  clip_length: 250
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 50]
  qvel_init: "zeros"
  keep_clips_idx: null

  # Domain Randomization Settings
  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.4, 1.0]
    static_friction_scale: [0.9, 1.1]
    armature_scale: [1.0, 1.05]
    com_jitter: [-0.05, 0.05]
    link_mass_scale: [0.9, 1.1]
    torso_mass_jitter: [-0.02, 0.02]
    qpos0_jitter: [-0.05, 0.05]

  # Reward Terms (for evaluation only — behavior-prior training doesn't use rewards)
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # Termination Criteria
  termination_criteria:
    root_too_far:
      max_distance: 0.1
    root_too_rotated:
      max_degrees: 60.0
    pose_error:
      max_l2_error: 4.5
    nan_termination: {}

# =============================================================================
# Rendering Configuration
# =============================================================================
render_config:
  render_camera_name: close_profile
  render_fps: 50
  render_interval: 1

# =============================================================================
# Multi-Mode Behavior-Prior Rollout Evaluation Configuration
# =============================================================================
# YAML key kept as `prior_rollout_config` for compat with saved configs and
# the train_behavior_prior reader; configures behavior-prior rollout eval.
prior_rollout_config:
  enabled: true
  eval_interval: 1
  max_steps: 400

# =============================================================================
# Network Architecture
# =============================================================================
# Behavior-prior network architecture. Encoder, decoder, and motion prior are
# loaded from the distill_expert checkpoint.
network_config:
  # arch_name kept as `distill_prior` for compat with saved configs and any
  # downstream branching that reads it.
  arch_name: distill_prior
  # YAML key kept as `rgm_layer_sizes` for backward-compat with saved configs +
  # task_transfer reads; sizes the (newly trained) behavior prior.
  rgm_layer_sizes: [2048, 2048, 1024, 512]
  # Encoder/decoder/motion-prior sizes and intention_size are loaded from
  # the distill_expert checkpoint.

# =============================================================================
# Behavior-Prior Training Loss Configuration
# =============================================================================
# YAML block name kept as `distill_prior_config` for compat with saved configs
# and the train_behavior_prior reader.
distill_prior_config:
  kl_weight: 1                        # Weight for KL divergence loss
  grad_clip_norm: 10.0                # Gradient clipping norm

  # KL Loss Weight Schedule
  use_kl_schedule: false
  kl_schedule_params:
    kl_start_weight: 1e-5
    kl_end_weight: 1e-3
    kl_start_ramp: 0.0
    kl_end_ramp: 0.25

# =============================================================================
# Training Setup
# =============================================================================
train_setup:
  checkpoint_to_restore: null
  restore_from_run_state: null
  train_subset_ratio: 0.8
  eval_every: 20_000_000
  reset_every: 20_000_000

  train_config:
    num_envs: 4096
    num_timesteps: 2_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 1e-4
    action_repeat: 1
    normalize_observations: true
    unroll_length: 20
    seed: 0
    deterministic_eval: true

# =============================================================================
# Logging Configuration
# =============================================================================
logging_config:
  project_name: SCAMPER
  group_name: behavior_prior
  exp_name: null
  clip_id: -1
  model_path: null

# =============================================================================
# Walker Configuration
# =============================================================================
walker_config:
  walker_name: "rodent"
  xml_variant: "limited-collisions"
  torque_actuators: true
  rescale_factor: 0.9
