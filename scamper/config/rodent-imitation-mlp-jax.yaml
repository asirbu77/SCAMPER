# =============================================================================
# Rodent MLP Imitation Configuration
# =============================================================================
# Configuration for training a rodent imitation agent using PPO with a plain
# MLP policy (no VAE latent bottleneck). Same environment and reward setup
# as the intention-based imitation config.
# =============================================================================

# =============================================================================
# VNL Environment Configuration
# =============================================================================
env_config:
  env_name: "RodentImitation"
  mujoco_impl: "jax"

  # Physics Solver
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  naconmax: 256
  njmax: 128
  noslip_iterations: 0

  # Timing
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  # Reference Clips
  clip_length: 250
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 50]
  qvel_init: "zeros"
  keep_clips_idx: null

  # Domain Randomization
  domain_randomization:
    use_domain_randomization: true
    floor_friction: [0.4, 1.0]
    static_friction_scale: [0.9, 1.1]
    armature_scale: [1.0, 1.05]
    com_jitter: [-0.05, 0.05]
    link_mass_scale: [0.9, 1.1]
    torso_mass_jitter: [-0.02, 0.02]
    qpos0_jitter: [-0.05, 0.05]

  # Reward Terms
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # Termination Criteria
  termination_criteria:
    root_too_far:
      max_distance: 0.1
    root_too_rotated:
      max_degrees: 60.0
    pose_error:
      max_l2_error: 4.5
    nan_termination: {}

# =============================================================================
# Rendering Configuration
# =============================================================================
render_config:
  render_camera_name: close_profile
  render_fps: 50
  render_interval: 1

# =============================================================================
# Network Architecture
# =============================================================================
# Plain MLP policy (no encoder/decoder/latent bottleneck)
network_config:
  arch_name: mlp
  mlp_layer_sizes: [2048, 1024, 1024, 512]
  critic_layer_sizes: [2048, 1024, 1024, 1024, 1024, 512]

# =============================================================================
# Training Setup
# =============================================================================
train_setup:
  checkpoint_to_restore: null
  restore_from_run_state: null
  train_subset_ratio: 0.8
  eval_every: 25_000_000
  reset_every: 25_000_000

  train_config:
    num_envs: 4096
    num_timesteps: 3_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 1e-4
    grad_clip_threshold: 20.0
    clipping_epsilon: 0.2
    discounting: 0.95
    action_repeat: 1
    entropy_cost: 1e-2
    vf_loss_coefficient: 0.25
    reward_scaling: 1
    normalize_observations: true
    unroll_length: 20
    seed: 0
    deterministic_eval: true

# =============================================================================
# Logging Configuration
# =============================================================================
logging_config:
  project_name: SCAMPER
  group_name: imitation-mlp
  exp_name:
  clip_id: -1
  model_path: model_checkpoints/

# =============================================================================
# Walker Configuration
# =============================================================================
walker_config:
  walker_name: "rodent"
  xml_variant: "limited-collisions"
  torque_actuators: true
  rescale_factor: 0.9
